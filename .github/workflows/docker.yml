# Builds the server image and pushes it to GitHub Container Registry when a release is
# published (by hand, from the draft the Apps workflow prepares). The image then appears
# under the repository's Packages as ghcr.io/linyeir/teahouse.
name: Docker

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Emulation for the arm64 build (Raspberry Pi and other small home servers).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # v0.3.0 → tags 0.3.0 and 0.3, plus latest unless the release is a pre-release.
      # Also sets the OCI labels that link the package to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/linyeir/teahouse
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
