# Builds the server image and pushes it to GitHub Container Registry when a release is
# published (by hand, from the draft the Apps workflow prepares). The image then appears
# under the repository's Packages as ghcr.io/linyeir/teahouse.
name: Docker

on:
  release:
    types: [published]
  # Runs the smoke test alone, against the image already published.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Pinned rather than ubuntu-latest, see apps.yml.

jobs:
  image:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Emulation for the arm64 build (Raspberry Pi and other small home servers).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # v0.3.0 → tags 0.3.0 and 0.3, plus latest unless the release is a pre-release.
      # Also sets the OCI labels that link the package to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/linyeir/teahouse
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The README's Quickstart as a stranger runs it: its compose block pasted into an empty
  # folder, pulling `latest`. For a release, `latest` must then be that release (unless it is
  # a pre-release version such as 0.5.0-rc.1, which does not move `latest`).
  smoke:
    needs: image
    if: ${{ !cancelled() && needs.image.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Compose block from the README
        run: |
          dir="$RUNNER_TEMP/quickstart"
          mkdir "$dir"
          awk '/^## Quickstart/ { q = 1 } q && /^ *```yaml/ { y = 1; next } y && /^ *```/ { exit } y' \
            README.md | sed 's/^   //' > "$dir/compose.yaml"
          cat "$dir/compose.yaml"
          grep -q 'image: ghcr.io/linyeir/teahouse:latest' "$dir/compose.yaml" \
            || { echo "::error::No compose block with the published image in the README's Quickstart"; exit 1; }
          echo "QUICKSTART=$dir" >> "$GITHUB_ENV"
      - name: Start it
        run: docker compose up -d
        working-directory: ${{ env.QUICKSTART }}
      # Polls the status of the image's HEALTHCHECK (Docker probes often while it starts).
      - name: Wait until healthy
        working-directory: ${{ env.QUICKSTART }}
        run: |
          container=$(docker compose ps -q teahouse)
          for i in $(seq 1 45); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            [ "$health" = healthy ] && break
            sleep 4
          done
          echo "Health: $health"
          [ "$health" = healthy ] || { echo "::error::The container did not become healthy"; exit 1; }
      - name: Version
        run: |
          served=$(curl -fsS http://localhost:8787/api/version | jq -r .version)
          echo "Serving $served"
          tag="${{ github.event.release.tag_name }}"
          if [ -n "$tag" ] && [[ "${tag#v}" != *-* ]] && [ "$served" != "${tag#v}" ]; then
            echo "::error::latest serves $served, not the release ${tag#v}"
            exit 1
          fi
      - name: Server log
        if: always()
        run: docker compose logs
        working-directory: ${{ env.QUICKSTART }}

