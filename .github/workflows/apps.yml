# Builds the Teahouse apps. Runs by hand (Actions → Apps → Run workflow) or for a v* tag;
# the results are attached to the run as artifacts.
name: Apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      # Only what the apps need: the server's native modules (better-sqlite3) would have to be
      # compiled, which fails on Windows runners and is wasted time everywhere else.
      - run: pnpm install --frozen-lockfile --filter "@teahouse/app..." --filter "@teahouse/client..."
      - run: pnpm --filter @teahouse/app build
      # One artifact per package format, so nobody downloads formats they cannot use.
      - name: Upload .deb (Debian, Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: teahouse-linux-deb
          path: packages/app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Upload .rpm (Fedora, openSUSE)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: teahouse-linux-rpm
          path: packages/app/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
      - name: Upload AppImage (any distribution)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: teahouse-linux-appimage
          path: packages/app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Upload installers (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: teahouse-windows
          path: |
            packages/app/src-tauri/target/release/bundle/msi/*.msi
            packages/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload .dmg (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: teahouse-macos
          path: packages/app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes "tools", which current SDK repositories no longer have.
          packages: platform-tools
      - name: Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
      # Only what the apps need: the server's native modules (better-sqlite3) would have to be
      # compiled, which fails on Windows runners and is wasted time everywhere else.
      - run: pnpm install --frozen-lockfile --filter "@teahouse/app..." --filter "@teahouse/client..."
      # The Android project is generated rather than committed until it needs changes.
      - run: pnpm --filter @teahouse/app tauri android init --ci
      # A debug build is signed with the SDK's debug key, so it installs without setting up
      # a release keystore. It also allows plain-HTTP servers on the LAN.
      - run: pnpm --filter @teahouse/app tauri android build --debug --apk
      - uses: actions/upload-artifact@v4
        with:
          name: teahouse-android
          path: packages/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # For a v* tag: collect every build into a draft release, to be reviewed and published by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          version=$(jq -r .version packages/app/src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version in packages/app/src-tauri/tauri.conf.json"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: teahouse-*
          path: dist
          merge-multiple: true
      - name: Name the APK
        run: |
          apks=$(find dist -name '*.apk')
          [ "$(echo "$apks" | wc -l)" = 1 ] || { echo "::error::Expected one APK, found: $apks"; exit 1; }
          mv "$apks" "dist/Teahouse_${GITHUB_REF_NAME#v}_android-debug.apk"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Teahouse $GITHUB_REF_NAME" --generate-notes $(find dist -type f)
