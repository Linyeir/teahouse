# Builds the Teahouse apps. Runs by hand (Actions → Apps → Run workflow) with the results as
# artifacts, or on every push to the release branch, which also prepares a draft release for
# the version in package.json.
name: Apps

on:
  workflow_dispatch:
  push:
    branches: [release]

permissions:
  contents: read

# Linux jobs run on a pinned Ubuntu rather than ubuntu-latest, so a new Ubuntu (26.04 from
# October 2026) arrives with a deliberate change here instead of in the middle of a release.
# Action versions are kept current by Dependabot (.github/dependabot.yml).
jobs:
  # A draft release is only made from code that passes lint, typecheck and tests.
  checks:
    if: github.ref == 'refs/heads/release'
    uses: ./.github/workflows/ci.yml

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner on purpose: an AppImage only runs on systems with at least
          # the glibc it was built against. Move to ubuntu-24.04 when GitHub retires 22.04.
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      # Only what the apps need: the server's native modules (better-sqlite3) would have to be
      # compiled, which fails on Windows runners and is wasted time everywhere else.
      - run: pnpm install --frozen-lockfile --filter "@teahouse/app..." --filter "@teahouse/client..."
      - run: pnpm --filter @teahouse/app build
      # One artifact per package format, so nobody downloads formats they cannot use.
      - name: Upload .deb (Debian, Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: teahouse-linux-deb
          path: packages/app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Upload .rpm (Fedora, openSUSE)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: teahouse-linux-rpm
          path: packages/app/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
      - name: Upload AppImage (any distribution)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: teahouse-linux-appimage
          path: packages/app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Upload installers (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: teahouse-windows
          path: |
            packages/app/src-tauri/target/release/bundle/msi/*.msi
            packages/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload .dmg (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: teahouse-macos
          path: packages/app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    env:
      # Certificate of the Teahouse signing key. Every APK is checked against it.
      CERT_SHA256: 26f049c6c5f42d66fd701a300094ddbc67e58d5e2f76183ce841389bf433b2b7
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          # The default list includes "tools", which current SDK repositories no longer have.
          packages: platform-tools
      - name: Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
      # Only what the apps need: the server's native modules (better-sqlite3) would have to be
      # compiled, which fails on Windows runners and is wasted time everywhere else.
      - run: pnpm install --frozen-lockfile --filter "@teahouse/app..." --filter "@teahouse/client..."
      # The Android project is generated rather than committed until it needs changes.
      - run: pnpm --filter @teahouse/app tauri android init --ci
      # Icons, and trust in CAs the user installed on the phone (packages/app/src-tauri/android).
      - run: packages/app/src-tauri/android/overlay.sh
      # A debug build, which Gradle signs with a throwaway debug key that the next step replaces.
      # One APK per architecture instead of a universal one: arm64 for current phones, arm for
      # old ones, x86_64 for emulators and Chromebooks. 32-bit x86 devices are long gone.
      - run: pnpm --filter @teahouse/app tauri android build --debug --apk --split-per-abi --target aarch64 armv7 x86_64
      # Every APK is signed with the same Teahouse key, so a new version installs over the old
      # one. Signed here rather than through Gradle, so no Gradle default can swap the key.
      - name: Sign with the Teahouse key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set (see README, Releasing)"
            exit 1
          fi
          keystore="$RUNNER_TEMP/teahouse.keystore"
          echo "$KEYSTORE" | base64 -d > "$keystore"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          apks=$(find packages/app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          [ -n "$apks" ] || { echo "::error::No APKs found"; exit 1; }
          for apk in $apks; do
            "$apksigner" sign --ks "$keystore" --ks-type JKS --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android "$apk"
          done
          rm "$keystore"
          for apk in $apks; do
            if ! "$apksigner" verify --print-certs "$apk" | grep -q "SHA-256 digest: $CERT_SHA256"; then
              echo "::error::$apk is not signed with the Teahouse key after signing"
              "$apksigner" verify --print-certs "$apk"
              exit 1
            fi
          done
      - name: Upload APK (arm64, current phones)
        uses: actions/upload-artifact@v7
        with:
          name: teahouse-android-arm64
          path: packages/app/src-tauri/gen/android/app/build/outputs/apk/arm64/**/*.apk
          if-no-files-found: error
      - name: Upload APK (arm, older phones)
        uses: actions/upload-artifact@v7
        with:
          name: teahouse-android-arm
          path: packages/app/src-tauri/gen/android/app/build/outputs/apk/arm/**/*.apk
          if-no-files-found: error
      - name: Upload APK (x86_64, emulators and Chromebooks)
        uses: actions/upload-artifact@v7
        with:
          name: teahouse-android-x86_64
          path: packages/app/src-tauri/gen/android/app/build/outputs/apk/x86_64/**/*.apk
          if-no-files-found: error

  # The Android app on an Android 17 emulator: the local network permission, and a server
  # whose certificate comes from a private CA (packages/app/e2e/android.ts). Uses the x86_64
  # APK built above, a debug build, so the test can drive its webview.
  android-e2e:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The test starts its own Teahouse server.
      - run: pnpm install --frozen-lockfile --filter "@teahouse/server..."
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # google_apis rather than google_apis_playstore: the test needs adb root to install a
      # CA into the user store the way Settings does.
      - name: Start an Android 17 emulator
        run: |
          image="system-images;android-37.0;google_apis;x86_64"
          sdkmanager --install emulator "$image" > /dev/null
          echo no | avdmanager create avd -n e2e -k "$image"
          nohup "$ANDROID_HOME/emulator/emulator" -avd e2e -no-window -no-audio -no-snapshot \
            -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 600 sh -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 5; done'
      - uses: actions/download-artifact@v8
        with:
          name: teahouse-android-x86_64
          path: apk
      - run: node packages/app/e2e/android.ts "$(find apk -name '*.apk' | head -1)"
      - name: Emulator log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/emulator.log"

  # For the release branch: collect every build into a draft release, to be reviewed and
  # published by hand. Publishing creates the tag. Later pushes with the same version update
  # the draft. A version that is already published fails, so it has to be bumped first.
  release:
    if: github.ref == 'refs/heads/release'
    needs: [checks, desktop, android, android-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The checks job has made sure every file carries the same version (pnpm version:check).
      - name: Version
        run: |
          version=$(jq -r .version package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::No valid version in package.json: $version"
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
      # The version's section of CHANGELOG.md, from its heading to the next version's heading.
      # Without one, GitHub's notes generated from pull request titles are used instead.
      - name: Release notes
        run: |
          awk -v heading="## [${TAG#v}]" '
            /^## \[/ { if (found) exit; found = index($0, heading) == 1; next }
            /^\[[^]]+\]: / { if (found) exit }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "NOTES=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
            if grep -qi "^## \[${TAG#v}\].*unreleased" CHANGELOG.md; then
              echo "::warning::CHANGELOG.md still calls ${TAG#v} unreleased. Set the date before publishing."
            fi
          else
            echo "::warning::No section for ${TAG#v} in CHANGELOG.md, so the notes are generated"
          fi
      # One folder per artifact, so each APK's architecture comes from its artifact name.
      - uses: actions/download-artifact@v8
        with:
          pattern: teahouse-*
          path: dist
      - name: Name the APKs
        run: |
          for dir in dist/teahouse-android-*; do
            abi=${dir#dist/teahouse-android-}
            apk=$(find "$dir" -name '*.apk')
            [ "$(echo "$apk" | wc -l)" = 1 ] || { echo "::error::Expected one APK in $dir"; exit 1; }
            mv "$apk" "dist/Teahouse_${TAG#v}_android-${abi}-debug.apk"
          done
          [ "$(find dist -name '*.apk' | wc -l)" = 3 ] || { echo "::error::Expected three APKs"; exit 1; }
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find dist -type f)
          echo "$files"
          # Notes from CHANGELOG.md replace a draft's notes. Generated notes are only made once.
          notes=()
          [ -n "${NOTES:-}" ] && notes=(--notes-file "$NOTES")
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::Release $TAG is already published. Bump the version for a new release."
              exit 1
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${notes[@]}"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $files
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Teahouse $TAG" "${notes[@]:---generate-notes}" $files
          fi
