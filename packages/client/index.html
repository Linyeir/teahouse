<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Teahouse</title>
    <!-- Applies the stored theme before the first paint (src/theme.ts has the same rules). -->
    <script>
      (() => {
        var only = { sakura: "light", halftone: "light", picturebook: "light", dracula: "dark", cyberpunk: "dark", gothic: "dark" };
        var known = ["standard", "nord", "catppuccin"].concat(Object.keys(only));
        var mode, preset, custom, style;
        try {
          mode = localStorage.getItem("teahouse.theme");
          preset = localStorage.getItem("teahouse.preset");
          // An uploaded theme: its CSS and modes, kept by src/customThemes.ts.
          custom = JSON.parse(localStorage.getItem("teahouse.themeCss") || "null");
        } catch (_e) {}
        if (mode !== "light" && mode !== "dark") {
          mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (custom && custom.id === preset && known.indexOf(preset) < 0) {
          style = document.createElement("style");
          style.id = "custom-theme";
          style.textContent = custom.css;
          document.head.appendChild(style);
          if (custom.modes && custom.modes.length === 1) only[preset] = custom.modes[0];
        } else if (known.indexOf(preset) < 0) preset = "standard";
        var root = document.documentElement;
        root.dataset.preset = preset;
        root.dataset.theme = only[preset] || mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
